name: Synchronize market index

on:
  pull_request:
    paths:
      - registry.json
      - approvals.json
      - scripts/extension-market-sync.mjs
      - .github/workflows/sync-market.yml
  push:
    branches: [main]
    paths:
      - registry.json
      - approvals.json
      - scripts/extension-market-sync.mjs
      - .github/workflows/sync-market.yml
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: extension-market-index
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "24.15.0"
      - name: Read candidate registry and approvals as data
        working-directory: trusted
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$PR_HEAD_SHA"
          git show "$PR_HEAD_SHA:registry.json" > ../candidate-registry.json
          # Pull requests opened before approvals existed keep the base approvals.
          git show "$PR_HEAD_SHA:approvals.json" > ../candidate-approvals.json 2>/dev/null || cp approvals.json ../candidate-approvals.json
      - name: Validate candidate enrollment and approvals with trusted code
        working-directory: trusted
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/extension-market-sync.mjs --registry ../candidate-registry.json --approvals ../candidate-approvals.json --previous index.v2.json --out index.v2.json --check
      - name: Show the release that review would approve
        working-directory: trusted
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/extension-market-sync.mjs --discover --registry ../candidate-registry.json --approvals ../candidate-approvals.json --previous index.v2.json --changed-from registry.json --out ../proposals.json

  generate:
    # Publication changes only when reviewed registry or approvals change on main.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.revision.outputs.base_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - id: revision
        run: echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "24.15.0"
      - name: Synchronize approved releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/extension-market-sync.mjs --registry registry.json --approvals approvals.json --previous index.v2.json --out index.v2.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-market-index
          path: index.v2.json
          if-no-files-found: error

  publish:
    needs: generate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          # This isolated job runs no submitted code and only stages index.v2.json.
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: generated-market-index
          path: generated
      - name: Publish generated index after race check
        env:
          EXPECTED_BASE_SHA: ${{ needs.generate.outputs.base_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE_SHA" || { echo "::error::main advanced during generation; rerun synchronization"; exit 1; }
          test -f generated/index.v2.json
          test "$(find generated -type f | wc -l | tr -d ' ')" = "1"
          cp generated/index.v2.json index.v2.json
          git diff --quiet -- index.v2.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.v2.json
          git commit -m "chore: synchronize market index"
          git push origin HEAD:main

  discover:
    # Discovery proposes approvals as pull requests; it never changes the index.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          # This job runs only trusted main code and pushes approval branches.
          persist-credentials: true
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "24.15.0"
      - name: Discover unapproved stable releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/extension-market-sync.mjs --discover --registry registry.json --approvals approvals.json --previous index.v2.json --out "$RUNNER_TEMP/proposals.json"
      - name: Open one approval pull request per release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          count="$(jq length "$RUNNER_TEMP/proposals.json")"
          for ((i = 0; i < count; i++)); do
            jq ".[$i]" "$RUNNER_TEMP/proposals.json" > "$RUNNER_TEMP/proposal.json"
            branch="$(jq -r .branch "$RUNNER_TEMP/proposal.json")"
            title="$(jq -r .title "$RUNNER_TEMP/proposal.json")"
            jq -r .body "$RUNNER_TEMP/proposal.json" > "$RUNNER_TEMP/proposal.md"
            if ! git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
              git checkout -q -B "$branch" "$base_sha"
              node scripts/extension-market-sync.mjs --apply-proposal "$RUNNER_TEMP/proposal.json" --approvals approvals.json
              git add -- approvals.json
              git commit -q -m "$title"
              git push -q origin "HEAD:refs/heads/$branch"
            fi
            # A closed proposal stays closed; maintainers rejected those exact bytes.
            if [ "$(gh pr list --head "$branch" --state all --json number --jq length)" = "0" ]; then
              gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/proposal.md"
            fi
          done
